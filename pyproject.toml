[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scoremill"
version = "0.8.0"
description = "Text-notation MIDI composition library designed for language-model agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["mido>=1.3"]
keywords = ["midi", "music", "composition", "notation", "agents", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

[project.optional-dependencies]
play = ["python-rtmidi>=1.5"]
mcp = ["mcp>=1.0"]

[project.urls]
Homepage = "https://github.com/CharlesCNorton/scoremill"
Issues = "https://github.com/CharlesCNorton/scoremill/issues"

[tool.setuptools]
py-modules = ["scoremill", "mcp_server", "jukebox"]
